name: apt-hunt-browser-policy
version: 1.3.0
description: Enforces bounded sequential browser Hunts, resolves observed product links, and removes API-backed web search.
provides_tools:
  - web_search
  - browser_observed_link
hooks:
  - pre_tool_call
  - transform_tool_result
  - on_session_end
capabilities:
  - tools.override
